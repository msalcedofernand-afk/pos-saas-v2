name: API and database checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: api-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-saas-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pos-saas-api/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pos-saas-infra/package-lock.json
      - run: npm ci
        working-directory: pos-saas-infra
      - run: npm audit --omit=dev --audit-level=high
        working-directory: pos-saas-infra
      - run: node scripts/validate-migrations.mjs
        working-directory: pos-saas-infra
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start Postgres-only Supabase stack
        run: |
          cp supabase/config.toml "$RUNNER_TEMP/supabase-config.toml"
          trap 'cp "$RUNNER_TEMP/supabase-config.toml" supabase/config.toml' EXIT
          sed -i '/^\[db.migrations\]/,/^\[/{s/^enabled = true/enabled = false/}' supabase/config.toml
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor --ignore-health-check
          cp "$RUNNER_TEMP/supabase-config.toml" supabase/config.toml
          trap - EXIT
        working-directory: pos-saas-infra
      - name: Dump Supabase containers after startup failure
        if: failure()
        run: |
          supabase status || true
          docker ps -a
          docker logs supabase_db_pos-saas-infra --tail 200 || true
        working-directory: pos-saas-infra
      - name: Apply base migrations on a clean database
        run: |
          set -o pipefail
          if ! supabase db reset --local --yes --version 20260920091555 2>&1 | tee "$RUNNER_TEMP/supabase-db-reset.log"; then
            while IFS= read -r line; do echo "::error title=Supabase reset::$line"; done < "$RUNNER_TEMP/supabase-db-reset.log"
            exit 1
          fi
        working-directory: pos-saas-infra
      - name: Apply cash constraints migration on a clean database
        run: |
          set -o pipefail
          if ! supabase db reset --local --yes --version 20260920092136 2>&1 | tee -a "$RUNNER_TEMP/supabase-db-reset.log"; then
            while IFS= read -r line; do echo "::error title=Supabase reset::$line"; done < "$RUNNER_TEMP/supabase-db-reset.log"
            exit 1
          fi
        working-directory: pos-saas-infra
      - name: Apply order integrity migrations on a clean database
        run: |
          set -o pipefail
          if ! supabase db reset --local --yes --version 20260920100000 2>&1 | tee -a "$RUNNER_TEMP/supabase-db-reset.log"; then
            while IFS= read -r line; do echo "::error title=Supabase reset::$line"; done < "$RUNNER_TEMP/supabase-db-reset.log"
            exit 1
          fi
        working-directory: pos-saas-infra
      - name: Apply payment reconciliation migrations on a clean database
        run: |
          set -o pipefail
          if ! supabase db reset --local --yes 2>&1 | tee -a "$RUNNER_TEMP/supabase-db-reset.log"; then
            while IFS= read -r line; do echo "::error title=Supabase reset::$line"; done < "$RUNNER_TEMP/supabase-db-reset.log"
            exit 1
          fi
        working-directory: pos-saas-infra
      - name: Upload database reset log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-db-reset-log
          path: ${{ runner.temp }}/supabase-db-reset.log
      - name: Run database tests
        run: |
          set -o pipefail
          test_status=0
          supabase test db --local 2>&1 | tee "$RUNNER_TEMP/supabase-test-db.log" || test_status=$?
          if [ "$test_status" -ne 0 ]; then
            direct_status=0
            for test_file in order_cash_integrity_test.sql tenant_isolation_test.sql auth_security_test.sql idempotency_test.sql role_transaction_test.sql input_constraints_test.sql organization_lifecycle_test.sql platform_user_membership_test.sql platform_audit_governance_test.sql platform_support_access_test.sql platform_metrics_operations_test.sql; do
              file_status=0
              docker run --rm --network host \
                -e PGPASSWORD=postgres \
                -v "$GITHUB_WORKSPACE/pos-saas-infra/supabase/tests:/tests:ro" \
                public.ecr.aws/supabase/pg_prove:3.36 \
                pg_prove --host=127.0.0.1 --port=54322 --username=postgres --dbname=postgres \
                  "/tests/database/$test_file" \
                2>&1 | tee -a "$RUNNER_TEMP/pg-prove-direct.log" || file_status=$?
              if [ "$file_status" -ne 0 ]; then
                direct_status=1
                echo "::error title=Direct pgTAP failure::$test_file returned exit code $file_status"
              fi
            done
            if [ "$direct_status" -ne 0 ]; then
              echo "::error title=Direct pgTAP diagnostic::One or more direct pgTAP files failed. See pg-prove-direct.log artifact."
              exit 1
            fi
            echo "::warning title=Supabase database test::supabase test db returned $test_status; direct pgTAP validation passed"
          fi
        working-directory: pos-saas-infra
      - name: Upload database test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-test-db-log
          path: ${{ runner.temp }}/supabase-test-db.log
      - name: Run concurrency checks
        run: bash scripts/test-concurrency.sh
        working-directory: pos-saas-infra
      - name: Run database lint
        if: always()
        run: supabase db lint --local
        working-directory: pos-saas-infra
      - if: always()
        run: supabase stop --no-backup
        working-directory: pos-saas-infra
