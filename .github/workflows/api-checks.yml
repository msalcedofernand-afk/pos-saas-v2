name: API and database checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-saas-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pos-saas-api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pos-saas-infra/package-lock.json
      - run: npm ci
        working-directory: pos-saas-infra
      - run: node scripts/validate-migrations.mjs
        working-directory: pos-saas-infra
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Postgres-only Supabase stack
        run: |
          cp supabase/config.toml "$RUNNER_TEMP/supabase-config.toml"
          trap 'cp "$RUNNER_TEMP/supabase-config.toml" supabase/config.toml' EXIT
          sed -i '/^\[db.migrations\]/,/^\[/{s/^enabled = true/enabled = false/}' supabase/config.toml
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor --ignore-health-check
          cp "$RUNNER_TEMP/supabase-config.toml" supabase/config.toml
          trap - EXIT
        working-directory: pos-saas-infra
      - name: Dump Supabase containers after startup failure
        if: failure()
        run: |
          supabase status || true
          docker ps -a
          docker logs supabase_db_pos-saas-infra --tail 200 || true
        working-directory: pos-saas-infra
      - name: Apply base migrations on a clean database
        run: |
          set -o pipefail
          if ! supabase db reset --local --yes --version 20260920091555 2>&1 | tee "$RUNNER_TEMP/supabase-db-reset.log"; then
            while IFS= read -r line; do echo "::error title=Supabase reset::$line"; done < "$RUNNER_TEMP/supabase-db-reset.log"
            exit 1
          fi
        working-directory: pos-saas-infra
      - name: Apply cash constraints migration on a clean database
        run: |
          set -o pipefail
          if ! supabase db reset --local --yes --version 20260920092136 2>&1 | tee -a "$RUNNER_TEMP/supabase-db-reset.log"; then
            while IFS= read -r line; do echo "::error title=Supabase reset::$line"; done < "$RUNNER_TEMP/supabase-db-reset.log"
            exit 1
          fi
        working-directory: pos-saas-infra
      - name: Apply order integrity migrations on a clean database
        run: |
          set -o pipefail
          if ! supabase db reset --local --yes --version 20260920100000 2>&1 | tee -a "$RUNNER_TEMP/supabase-db-reset.log"; then
            while IFS= read -r line; do echo "::error title=Supabase reset::$line"; done < "$RUNNER_TEMP/supabase-db-reset.log"
            exit 1
          fi
        working-directory: pos-saas-infra
      - name: Apply payment reconciliation migrations on a clean database
        run: |
          set -o pipefail
          if ! supabase db reset --local --yes 2>&1 | tee -a "$RUNNER_TEMP/supabase-db-reset.log"; then
            while IFS= read -r line; do echo "::error title=Supabase reset::$line"; done < "$RUNNER_TEMP/supabase-db-reset.log"
            exit 1
          fi
        working-directory: pos-saas-infra
      - name: Upload database reset log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-db-reset-log
          path: ${{ runner.temp }}/supabase-db-reset.log
      - run: supabase test db --local
        working-directory: pos-saas-infra
      - run: supabase db lint --local
        working-directory: pos-saas-infra
      - if: always()
        run: supabase stop --no-backup
        working-directory: pos-saas-infra
