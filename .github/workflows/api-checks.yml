name: API and database checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-saas-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pos-saas-api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pos-saas-infra/package-lock.json
      - run: npm ci
        working-directory: pos-saas-infra
      - run: node scripts/validate-migrations.mjs
        working-directory: pos-saas-infra
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
        working-directory: pos-saas-infra
      - run: supabase db reset --local --yes
        working-directory: pos-saas-infra
      - run: supabase db lint --local
        working-directory: pos-saas-infra
      - if: always()
        run: supabase stop --no-backup
        working-directory: pos-saas-infra
