name: Phase 6 operational release gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase6-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGING_API_URL: ${{ vars.STAGING_API_URL || 'https://mesa-clara-api-staging.vercel.app' }}
  STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL || 'https://pos-saas-v2.vercel.app' }}

jobs:
  operational-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pos-saas-infra/package-lock.json
      - run: npm ci
        working-directory: pos-saas-infra
      - name: Prepare deployment evidence
        run: |
          mkdir -p "$RUNNER_TEMP/phase6-release-evidence"
          git show -s --format='commit=%H%nsubject=%s%nauthor=%an%ndate=%cI' HEAD > "$RUNNER_TEMP/phase6-release-evidence/commit.txt"
          printf 'api_url=%s\nweb_url=%s\n' "$STAGING_API_URL" "$STAGING_WEB_URL" > "$RUNNER_TEMP/phase6-release-evidence/environment.txt"
      - name: Validate migration ordering
        run: node scripts/validate-migrations.mjs
        working-directory: pos-saas-infra
      - name: Check staging health, readiness and web status
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/phase6-release-evidence"
          curl --fail --location --show-error --retry 3 --retry-delay 5 --max-time 20 \
            "$STAGING_API_URL/api/v1/health" | tee "$evidence/api-health.json"
          curl --fail --location --show-error --retry 3 --retry-delay 5 --max-time 20 \
            "$STAGING_API_URL/api/v1/health/ready" | tee "$evidence/api-readiness.json"
          jq -e '.status == "ready" and .dependencies.supabase == "ok"' "$evidence/api-readiness.json"
          curl --fail --location --show-error --retry 3 --retry-delay 5 --max-time 20 \
            "$STAGING_WEB_URL/status" -o "$evidence/web-status.html"
          private_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "$STAGING_API_URL/api/v1/platform/metrics")
          test "$private_status" = "401"
          printf '{"private_metrics_without_session":%s}\n' "$private_status" > "$evidence/access-control.json"
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-release-evidence
          path: ${{ runner.temp }}/phase6-release-evidence
          if-no-files-found: warn
