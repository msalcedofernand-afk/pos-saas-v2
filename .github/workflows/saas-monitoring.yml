name: SaaS availability monitoring

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saas-monitoring
  cancel-in-progress: true

env:
  STAGING_API_URL: ${{ vars.STAGING_API_URL || 'https://mesa-clara-api-staging.vercel.app' }}
  STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL || 'https://pos-saas-v2.vercel.app' }}
  PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
  PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}

jobs:
  availability:
    runs-on: ubuntu-latest
    steps:
      - name: Check staging API health
        run: |
          set -euo pipefail
          curl --fail --location --show-error --retry 3 --retry-delay 5 --max-time 20 "$STAGING_API_URL/api/v1/health"

      - name: Check staging API readiness and Supabase dependency
        run: |
          set -euo pipefail
          response=$(curl --fail --location --show-error --retry 3 --retry-delay 5 --max-time 20 "$STAGING_API_URL/api/v1/health/ready")
          echo "$response"
          echo "$response" | jq -e '.status == "ready" and .dependencies.supabase == "ok"'

      - name: Check staging web status
        run: |
          set -euo pipefail
          curl --fail --location --show-error --retry 3 --retry-delay 5 --max-time 20 "$STAGING_WEB_URL/status"

      - name: Check production API health
        if: env.PRODUCTION_API_URL != '' && env.PRODUCTION_WEB_URL != ''
        run: |
          set -euo pipefail
          curl --fail --location --show-error --retry 3 --retry-delay 5 --max-time 20 "$PRODUCTION_API_URL/api/v1/health"
          response=$(curl --fail --location --show-error --retry 3 --retry-delay 5 --max-time 20 "$PRODUCTION_API_URL/api/v1/health/ready")
          echo "$response"
          echo "$response" | jq -e '.status == "ready" and .dependencies.supabase == "ok"'

      - name: Check production web status
        if: env.PRODUCTION_API_URL != '' && env.PRODUCTION_WEB_URL != ''
        run: |
          set -euo pipefail
          curl --fail --location --show-error --retry 3 --retry-delay 5 --max-time 20 "$PRODUCTION_WEB_URL/status"

      - name: Warn when production monitoring is not configured
        if: env.PRODUCTION_API_URL == '' || env.PRODUCTION_WEB_URL == ''
        run: echo "::warning::Configura PRODUCTION_API_URL y PRODUCTION_WEB_URL como variables de GitHub para monitorear producción."

      - name: Send optional availability alert
        if: failure()
        env:
          HEALTH_ALERT_WEBHOOK_URL: ${{ secrets.HEALTH_ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$HEALTH_ALERT_WEBHOOK_URL" ]; then
            echo "No HEALTH_ALERT_WEBHOOK_URL configured; the failed workflow remains the alert."
            exit 0
          fi
          curl --fail --location --show-error --max-time 20 \
            -H "Content-Type: application/json" \
            -d '{"text":"Mesa Clara staging: fallo de disponibilidad en API, readiness o web. Revisar el workflow SaaS availability monitoring."}' \
            "$HEALTH_ALERT_WEBHOOK_URL"
