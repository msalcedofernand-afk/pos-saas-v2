name: SaaS availability monitoring

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saas-monitoring
  cancel-in-progress: true

env:
  API_URL: https://mesa-clara-api-staging.vercel.app
  WEB_URL: https://pos-saas-v2.vercel.app

jobs:
  availability:
    runs-on: ubuntu-latest
    steps:
      - name: Check API health
        run: |
          set -euo pipefail
          curl --fail --location --show-error --retry 3 --retry-delay 5 --max-time 20 "$API_URL/api/v1/health"

      - name: Check API readiness and Supabase dependency
        run: |
          set -euo pipefail
          response=$(curl --fail --location --show-error --retry 3 --retry-delay 5 --max-time 20 "$API_URL/api/v1/health/ready")
          echo "$response"
          echo "$response" | jq -e '.status == "ready" and .dependencies.supabase == "ok"'

      - name: Check web status
        run: |
          set -euo pipefail
          curl --fail --location --show-error --retry 3 --retry-delay 5 --max-time 20 "$WEB_URL/status"

      - name: Send optional availability alert
        if: failure()
        env:
          HEALTH_ALERT_WEBHOOK_URL: ${{ secrets.HEALTH_ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$HEALTH_ALERT_WEBHOOK_URL" ]; then
            echo "No HEALTH_ALERT_WEBHOOK_URL configured; the failed workflow remains the alert."
            exit 0
          fi
          curl --fail --location --show-error --max-time 20 \
            -H "Content-Type: application/json" \
            -d '{"text":"Mesa Clara staging: fallo de disponibilidad en API, readiness o web. Revisar el workflow SaaS availability monitoring."}' \
            "$HEALTH_ALERT_WEBHOOK_URL"
