name: Web E2E against deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_WEB_URL }}
      PLAYWRIGHT_API_URL: ${{ secrets.E2E_API_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_RESTRICTED_EMAIL: ${{ secrets.E2E_RESTRICTED_EMAIL }}
      E2E_RESTRICTED_PASSWORD: ${{ secrets.E2E_RESTRICTED_PASSWORD }}
      E2E_REQUIRE_FULL_SUITE: "true"
    defaults:
      run:
        working-directory: pos-saas-web
    steps:
      - uses: actions/checkout@v4
      - name: Validate required deployment secrets
        shell: bash
        run: |
          required=(PLAYWRIGHT_BASE_URL PLAYWRIGHT_API_URL E2E_EMAIL E2E_PASSWORD E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_RESTRICTED_EMAIL E2E_RESTRICTED_PASSWORD)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pos-saas-web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
