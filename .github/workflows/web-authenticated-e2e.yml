name: Authenticated web E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-authenticated-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: staging
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_WEB_URL }}
      PLAYWRIGHT_API_URL: ${{ secrets.E2E_API_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_RESTRICTED_EMAIL: ${{ secrets.E2E_RESTRICTED_EMAIL }}
      E2E_RESTRICTED_PASSWORD: ${{ secrets.E2E_RESTRICTED_PASSWORD }}
      E2E_PLATFORM_EMAIL: ${{ secrets.E2E_PLATFORM_EMAIL }}
      E2E_PLATFORM_PASSWORD: ${{ secrets.E2E_PLATFORM_PASSWORD }}
      E2E_PLATFORM_TARGET_ORGANIZATION_ID: ${{ secrets.E2E_PLATFORM_TARGET_ORGANIZATION_ID }}
      E2E_PLATFORM_TARGET_USER_ID: ${{ secrets.E2E_PLATFORM_TARGET_USER_ID }}
      E2E_REQUIRE_FULL_SUITE: "true"
    defaults:
      run:
        working-directory: pos-saas-web
    steps:
      - uses: actions/checkout@v5
      - name: Validate required deployment secrets
        shell: bash
        run: |
          required=(PLAYWRIGHT_BASE_URL PLAYWRIGHT_API_URL E2E_EMAIL E2E_PASSWORD E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_RESTRICTED_EMAIL E2E_RESTRICTED_PASSWORD E2E_PLATFORM_EMAIL E2E_PLATFORM_PASSWORD E2E_PLATFORM_TARGET_ORGANIZATION_ID E2E_PLATFORM_TARGET_USER_ID)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required repository secret: $name"
              exit 1
            fi
          done
      - name: Wait for staging deployment
        shell: bash
        run: |
          set -euo pipefail
          api_url="${PLAYWRIGHT_API_URL%/}"
          web_url="${PLAYWRIGHT_BASE_URL%/}"
          for attempt in $(seq 1 30); do
            api_status=$(curl --location --silent --show-error --output /tmp/api-ready.json --write-out "%{http_code}" --max-time 20 "$api_url/api/v1/health/ready" || true)
            web_status=$(curl --location --silent --show-error --output /tmp/web-status.html --write-out "%{http_code}" --max-time 20 "$web_url/status" || true)
            if [ "$api_status" = "200" ] && [ "$web_status" = "200" ]; then
              echo "Staging está disponible. API=$api_status Web=$web_status"
              exit 0
            fi
            echo "Esperando staging (intento $attempt/30). API=$api_status Web=$web_status"
            sleep 20
          done
          echo "Staging no estuvo disponible dentro del tiempo esperado"
          exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pos-saas-web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
